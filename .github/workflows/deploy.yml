name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || true
      
      - name: Build application
        run: npm run build
      
      - name: Run tests
        run: npm test || true
      
      - name: Build Docker image
        run: |
          docker build -t vetconnect:${{ github.sha }} .
          docker tag vetconnect:${{ github.sha }} vetconnect:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/VETAPPCLOUD
            git pull origin main
            
            # Backup antes do deploy
            ./scripts/backup.sh || true
            
            # Deploy com health check
            ./scripts/deploy.sh ${{ github.sha }}
            
            # Verificar se está OK
            if ! ./scripts/health-check.sh; then
              echo "Deploy falhou, a fazer rollback..."
              ./scripts/rollback.sh
              exit 1
            fi
            
            echo "Deploy concluído com sucesso!"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deploy concluído com sucesso!"
          # Adicionar notificação Slack/Discord aqui
      
      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deploy falhou!"
          # Adicionar notificação Slack/Discord aqui
