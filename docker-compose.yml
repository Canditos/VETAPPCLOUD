services:
  postgres:
    image: postgres:16-alpine
    container_name: vetconnect_db
    environment:
      POSTGRES_USER: vetconnect
      POSTGRES_PASSWORD: vetconnect123
      POSTGRES_DB: vetconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vetconnect_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vetconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: