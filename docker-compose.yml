version: '3.8'

services:
  # === Aplicação Principal ===
  app:
    image: qu4vzys28w5qfn252t4a81hl:a042bb3af3d7c053a49b426e663c1847e5932136
    container_name: vetconnect-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # === Canary (para testes) ===
  canary:
    image: qu4vzys28w5qfn252t4a81hl:a042bb3af3d7c053a49b426e663c1847e5932136
    container_name: vetconnect-canary
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3001:3000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  coolify:
    external: true